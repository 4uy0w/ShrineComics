<!DOCTYPE HTML>

<html>
	<head>
		<title> Register </title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<div class="register-area">
			<div class="register-box">
				<div class="image-decoration">
					<div class="container-decoration">
						<section class="user-data">
							<img src="#image" id="image-photo-profile">
							<h2 id="username-text">user</h2>
						</section>
						<section class="clock-timestamps">
							<h3 id="timestamps-clock">15:35/7/9/2025</h3>
						</section>
					</div>
				</div>
				<div class="register-form">
					<div class="form-container">
						<form action="action.php" method="post" enctype="multipart/form-data">
							<input type="text" id="username-field" name="username" placeholder="username">
							<section class="small-container">
								<input type="email" id="email-field" name="email" placeholder="email">
								<input type="password" id="password-field" name="password" placeholder="password">
							</section>
							<input type="text" id="address-field" name="address" placeholder="address">
							<section class="small-container">
								<select id="role-field" name="role">
									<option value="writer">Writer</option>
									<option value="reader">Reader</option>
								</select>
								<input type="text" id="telephone-field" name="telephone_number" placeholder="telephone">
							</section>
							<input type="file" id="file-upload" name="photo-profile">
							<button type="button" id="file-field">Pilih Foto</button>
							<input type="submit" id="submit-button" value="Sign In">
						</form>
						<a href="../login/"><button id="goto-login">Have account and Login</button></a>
					</div>
				</div>
			</div>
		</div>
		<script src="script.js">
		</script>
	</body>
</html>
