<!DOCTYPE HTML>

<html>
	<head>
		<title> Register </title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<div class="register-area">
			<div class="register-box">
				<div class="image-decoration">
					<div class="container-decoration">
						<section class="user-data">
							<img src="../../image/default.png" id="image-photo-profile">
							<h2 id="username-text">Your Name</h2>
						</section>
						<section class="clock-timestamps">
							<h3 id="timestamps-clock">15:35/7/9/2025</h3>
						</section>
					</div>
				</div>
				<div class="register-form">
					<div class="form-container">
						<form action="http://127.0.0.1:8000/action-register.php" method="post" enctype="multipart/form-data">
							<section class="input-global">
								<p id="username-box">username</p>
								<input type="text" id="username-field" name="username">
							</section>
							<section class="small-container">
								<section class="input-global">
									<p id="email-box">email</p>
									<input type="email" id="email-field" name="email">
								</section>
								<section class="input-global">
									<p>*password</p>
									<input type="password" id="password-field" name="password" >
								</section>
							</section>
							<section class="input-global">
								<p id="right-p">address</p>
								<input type="text" id="address-field" name="address">
							</section>
							<section class="small-container">
								<section class="input-global">
									<p id="telephone-box">telephone</p>
									<input type="text" id="telephone-field" name="telephone">
								</section>
								<section class="input-global">
									<input type="file" id="file-upload" name="photo-profile">
									<button type="button" id="file-field">Pick Photo</button>
								</section>
							</section>
							<input type="submit" id="submit-button" value="Sign In">
						</form>
						<div class="line-separator-group">
							<div class="separator">
								Or
							</div>
						</div>
						<a href="../login/"><button id="goto-login">Have account and Login</button></a>
					</div>
				</div>
			</div>
		</div>
		<script src="script.js">
		</script>
	</body>
</html>
