<!DOCTYPE HTML>

<html>
	<head>
		<title> Login </title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<div class="login-area">
			<div class="login-box">
				<div class="login-section">
					<div class="login-title">
						<h2 id="login-title">Login</h2>
					</div>
					<div class="login-form">
						<form action="action.php" method="post">
							<p id="username-title">username</p>
							<input type="text" id="username-box" name="username">
							<p id="password-title">password</p>
							<input type="password" id="password-box" name="password">
							<p id="email-title">email</p>
							<input type="email" id="email-box" name="email"><br>
							<button type="submit" id="submit-button">Login</button>
						</form>
						<a href="../register/"><button id="Register-Button">Dont have account?</button></a>
					</div>
				</div>
				<div class="image-decoration">
					<section class="timestamps-box">
						<h3 id="clock-java">Clock</h3>
					</section>
				</div>
			</div>
		</div>
		<script src="script.js">
		</script>
	</body>
</html>
